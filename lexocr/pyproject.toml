[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lexocr"
version = "0.1.0"
description = "Legal PDF OCR (text-layer + RapidOCR fallback)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pymupdf>=1.24"]

[project.optional-dependencies]
cpu = ["rapidocr>=3.9,<4", "onnxruntime>=1.18"]
gpu = ["rapidocr>=3.9,<4", "onnxruntime-gpu>=1.18"]
dev = ["pytest"]

[tool.hatch.build.targets.wheel]
packages = ["."]
exclude = ["pyproject.toml", "README.md", "setup_remote.sh", "PKG-INFO"]

[tool.hatch.build.targets.wheel.sources]
"." = "lexocr"

[tool.ruff]
line-length = 100
